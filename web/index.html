<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warb — Proactive Opportunity Engine</title>
    <meta name="description" content="AI-powered proactive client opportunity engine for Warba Bank's corporate banking relationship managers.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <!-- Google Identity Services (GSI) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">W</div>
                <div class="logo-text">
                    <span class="logo-title">Warba Bank</span>
                    <span class="logo-subtitle">Opportunity Engine</span>
                </div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="#dashboard" class="nav-item active" data-page="dashboard" id="nav-dashboard">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                <span>Dashboard</span>
            </a>
            <a href="#clients" class="nav-item" data-page="clients" id="nav-clients">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span>Clients</span>
            </a>
            <a href="#opportunities" class="nav-item" data-page="opportunities" id="nav-opportunities">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                <span>Opportunities</span>
                <span class="nav-badge" id="opp-badge" style="display:none">0</span>
            </a>
            <a href="#products" class="nav-item" data-page="products" id="nav-products">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                <span>Products</span>
            </a>
        </nav>

        <!-- Dynamic User Profile / Google Sign-In Footer -->
        <div class="sidebar-footer" id="sidebar-auth-footer">
            <div class="rm-profile" id="user-profile-widget">
                <div class="rm-avatar" id="user-avatar">RM</div>
                <div class="rm-info">
                    <span class="rm-name" id="user-name">Ahmad Al-Mutairi</span>
                    <span class="rm-title" id="user-role">Senior RM</span>
                </div>
                <button class="btn-logout" id="btn-sidebar-logout" title="Sign Out" style="display:none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
            <div id="sidebar-gsi-container" class="gsi-container" style="display:none;"></div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
        <!-- Header -->
        <header class="top-header">
            <div class="header-left">
                <h1 class="page-title" id="page-title">Dashboard</h1>
            </div>
            <div class="header-right">
                <!-- Google Sign-In / Header Profile Button -->
                <div class="header-auth" id="header-auth">
                    <div id="header-gsi-btn" class="header-gsi-slot"></div>
                    <button class="btn btn-secondary btn-sm" id="btn-login-modal" style="display:none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                        Sign in with Google
                    </button>
                    <div class="user-pill" id="header-user-pill" style="display:none;">
                        <img class="user-pill-avatar" id="header-user-avatar" src="" alt="Avatar" />
                        <span class="user-pill-name" id="header-user-name">User</span>
                        <button class="btn-pill-logout" id="btn-header-logout" title="Sign Out">✕</button>
                    </div>
                </div>

                <button class="btn btn-primary btn-scan" id="btn-portfolio-scan" title="AI-scan entire portfolio for opportunities">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    Portfolio Scan
                </button>
            </div>
        </header>

        <!-- Page Container -->
        <div class="page-container" id="page-container">
            <!-- Content loaded dynamically by app.js -->
            <div class="loading-screen" id="initial-loader">
                <div class="loader-pulse"></div>
                <p>Initializing Opportunity Engine...</p>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay" style="display:none">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title"></h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
