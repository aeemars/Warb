# ============================================
# Render Blueprint — Infrastructure as Code
# https://docs.render.com/blueprint-spec
# ============================================

services:
  - type: web
    name: warb
    runtime: docker
    repo: https://github.com/YOUR_USERNAME/Warb  # ← Update with your repo URL
    plan: starter                                  # $7/mo — supports persistent disks
    region: frankfurt                              # EU region — closest to Kuwait
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api
    autoDeploy: true

    # Persistent disk for SQLite database
    disk:
      name: warb-data
      mountPath: /data
      sizeGB: 1                                    # 1 GB ($0.25/mo) — plenty for SQLite

    # Environment variables — set these in Render Dashboard > Environment
    envVars:
      - key: PORT
        value: 8080
      - key: DB_PATH
        value: /data/opportunity.db
      - key: ENV
        value: production
      - key: OPENROUTER_API_KEY
        sync: false                                # Must be set manually in dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false                                # Must be set manually in dashboard
      - key: AI_MODEL
        value: inclusionai/ling-3.0-flash-fin:free
      - key: CORS_ALLOWED_ORIGINS
        value: https://warb.onrender.com           # ← Update with your actual Render URL
